# 辽宁金融单招在线备考平台 - 独立部署
# 部署后仅占用指定端口与数据卷，不影响宿主机其他项目

services:
  lnexam:
    build: .
    image: lnexam:latest
    container_name: lnexam
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      # 纸质卷「AI识别答题卡」：阶跃星辰密钥（勿写进镜像，仅在部署环境注入）
      # - STEPFUN_API_KEY=
      # - STEPFUN_API_BASE=https://api.stepfun.com/v1
      # - STEPFUN_VISION_MODEL=step-1o-turbo-vision
    volumes:
      # 持久化数据库与上传数据，避免容器删除后丢失
      - lnexam-data:/app/server/data
    # 可选：限制资源，与其他项目隔离
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

volumes:
  lnexam-data:
