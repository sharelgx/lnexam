# 辽宁金融单招在线备考平台 - 独立部署
# 部署后仅占用指定端口与数据卷，不影响宿主机其他项目

services:
  lnexam:
    build: .
    image: lnexam:latest
    container_name: lnexam
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      # 纸质卷「AI识别答题卡」：智谱 GLM（勿写进镜像；也可在后台管理写入数据库）
      # - GLM_API_KEY=
      # - GLM_API_BASE=https://open.bigmodel.cn/api/paas/v4
      # - GLM_VISION_MODEL=glm-4v-plus
    volumes:
      # 持久化数据库与上传数据，避免容器删除后丢失
      - lnexam-data:/app/server/data
    # 可选：限制资源，与其他项目隔离
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

volumes:
  lnexam-data:
